name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install ImageMagick if missing
        run: command -v convert || sudo apt-get install -y imagemagick

      - name: Install Capacitor
        working-directory: mobile
        run: npm install

      - name: Create Android project
        working-directory: mobile
        run: npx cap add android

      - name: Patch Android project (screen protection + icon)
        working-directory: mobile
        run: sh patch-android.sh

      - name: Sync
        working-directory: mobile
        run: npx cap sync android

      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: english-with-ali-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
